<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 4 - Full Project Implementation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="logo">ApexPlanet Task 4</div>
        <nav>
            <ul class="nav-links">
                <li><a href="#about">About</a></li>
                <li><a href="#products">Products</a></li>
                <li><a href="#todo">Task Manager</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">

        <!-- 1. Portfolio Section -->
        <section id="about" class="section">
            <h2>About Me</h2>
            <p>Welcome to my full Web Development project showcase! Built using clean HTML5, CSS3, and modern JavaScript ES6.</p>
        </section>

        <!-- 2. Product Listing Page with Filtering & Sorting -->
        <section id="products" class="section">
            <h2>Product Listing Showcase</h2>
            
            <div class="filter-controls">
                <div class="control-group">
                    <label for="categoryFilter">Category:</label>
                    <select id="categoryFilter">
                        <option value="all">All Categories</option>
                        <option value="electronics">Electronics</option>
                        <option value="apparel">Apparel</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="priceSort">Sort by Price:</label>
                    <select id="priceSort">
                        <option value="default">Default</option>
                        <option value="low-high">Price: Low to High</option>
                        <option value="high-low">Price: High to Low</option>
                    </select>
                </div>
            </div>

            <div id="productGrid" class="product-grid"></div>
        </section>

        <!-- 3. To-Do List with Local Storage -->
        <section id="todo" class="section">
            <h2>Task Manager (LocalStorage Persistent)</h2>
            <div class="todo-app">
                <div class="input-group">
                    <input type="text" id="taskInput" placeholder="Enter new task...">
                    <button id="addTaskBtn" class="action-btn">Add Task</button>
                </div>
                <ul id="taskList"></ul>
            </div>
        </section>

        <!-- 4. Contact Section -->
        <section id="contact" class="section">
            <h2>Get In Touch</h2>
            <form id="portfolioContact">
                <div class="form-group">
                    <label for="contactName">Name</label>
                    <input type="text" id="contactName" placeholder="Your Name" required>
                </div>
                <div class="form-group">
                    <label for="contactEmail">Email</label>
                    <input type="email" id="contactEmail" placeholder="Your Email" required>
                </div>
                <div class="form-group">
                    <label for="contactMessage">Message</label>
                    <textarea id="contactMessage" rows="4" placeholder="Your Message" required></textarea>
                </div>
                <button type="submit" class="action-btn">Send Message</button>
                <p id="contactStatus" class="status-msg"></p>
            </form>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
